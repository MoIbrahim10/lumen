name: Lumen dependency security validation

'on':
  pull_request:
    branches: [main]
    paths:
      - '.bun-version'
      - '.node-version'
      - 'bun.lock'
      - 'package.json'
      - 'patches/**'
      - 'src/styles.css'
      - 'vite.config.ts'
      - '.github/workflows/dependency-security-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org

      - name: Audit locked dependencies
        run: bun audit --registry=https://registry.npmjs.org

      - name: Type-check
        run: bun ./node_modules/typescript/bin/tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build with the Lovable development integration enabled
        env:
          LOVABLE_DEV_SERVER: 'true'
        run: bun run build

      - name: Smoke-test the Vite development integration
        shell: bash
        env:
          LOVABLE_DEV_SERVER: 'true'
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/lumen-vite-dev.log"
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$log_file"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Vite development server exited before becoming ready.' >&2
              exit 1
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo 'Vite development server did not respond before the timeout.' >&2
              exit 1
            fi
            sleep 1
          done

          bun -e 'const { theme } = await Bun.file("src/tailwind.config.lov.json").json(); const expected = ["colors", "screens", "spacing", "borderRadius", "fontFamily", "opacity"]; if (!theme || expected.some((key) => !theme[key])) process.exit(1);'
          echo 'Vite served the app and generated the expected Tailwind 4 configuration.'
